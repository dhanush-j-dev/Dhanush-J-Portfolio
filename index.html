<!doctype html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Anti-flash Theme Initialization -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('portfolio-theme');
          var isDark = saved ? saved === 'dark' : true;
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>

    <!-- SEO -->
    <title>Dhanush J | Java Developer</title>
    <meta name="description" content="Portfolio of Dhanush J, an entry-level Java Developer specializing in Java, Spring Boot, REST APIs, SQL, MySQL, React, Spring Security, JWT, automated testing and full-stack engineering." />
    <meta name="keywords" content="Dhanush J, Java Developer, Spring Boot, Backend Developer, Full Stack, REST APIs, MySQL, Spring Security, JWT, React, Docker, Chennai" />
    <meta name="author" content="Dhanush J" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Dhanush J | Java Developer | Spring Boot & Full-Stack" />
    <meta property="og:description" content="Building reliable software with Java, Spring Boot & modern web technologies." />
    <meta property="og:image" content="/logo.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[var(--bg-primary)] text-[var(--text-primary)] antialiased selection:bg-blue-600 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
